name: Bug report
description: Report a reproducible problem with Developer Mode
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before filing:
        - Read [docs/FAQ.md](https://github.com/lingyingaojue/dsh-dev-mode/blob/main/docs/FAQ.md) and search the existing issues.
        - Redact tokens, cookies, API keys, personal paths, and private data from every log or screenshot you attach.
        - For security issues, follow [SECURITY.md](https://github.com/lingyingaojue/dsh-dev-mode/blob/main/SECURITY.md) and report privately instead of opening a public issue.

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: The output of `dsh --version` (for example `0.2.2-rc.3`).
      placeholder: "0.2.2-rc.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Where did this happen? macOS and Linux are untested and we may not be able to reproduce there.
      options:
        - Windows 11
        - Windows 10
        - Windows (other version)
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: preset
    attributes:
      label: Preset
      description: Which Developer Mode preset was active? `dev` is the coordinator; `dev-worker` is the background executor.
      options:
        - dev (coordinator)
        - dev-worker (executor)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in plain language. What did you ask the agent to do, and what did it do instead?
      placeholder: "I asked Developer Mode to ... and it ..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest numbered sequence that shows the problem. Include the exact prompt if the agent is involved.
      placeholder: |
        1. Install the plugin and start a new session.
        2. Select Developer Mode.
        3. Prompt: "..."
        4. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include the exact error message if there is one.
    validations:
      required: true

  - type: textarea
    id: logs-evidence
    attributes:
      label: Logs and evidence paths
      description: >
        Relevant files under your workspace's `.dsh-dev/` folder (for example `plan.md`,
        `status.md`, `reports/build-N.md`, `qa/qa-N.md`, `qa/evidence/`). Paste short excerpts,
        not giant logs. Remove secrets, tokens, personal paths, and private data first.
      placeholder: |
        .dsh-dev/plan.md
        .dsh-dev/qa/qa-1.md

        Short excerpt (redacted):
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Please confirm all three before submitting.
      options:
        - label: I started a **new session** after installing or updating the plugin; existing sessions do not pick up changes.
          required: true
        - label: I checked the session permissions and the exact permission/sandbox message, if one appeared.
          required: true
        - label: I removed tokens, cookies, API keys, personal paths, and private data from everything I pasted.
          required: true
